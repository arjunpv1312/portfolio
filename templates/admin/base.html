<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} · Arjun PV</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin-bg:      #0a0f1a;
            --admin-surface: #111827;
            --admin-border:  rgba(255,255,255,0.08);
            --admin-accent:  #00d4ff;
            --admin-danger:  #ef4444;
            --admin-success: #22c55e;
            --admin-warn:    #f59e0b;
            --admin-muted:   rgba(255,255,255,0.45);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--admin-bg);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        /* ── Top bar ── */
        .admin-topbar {
            background: var(--admin-surface);
            border-bottom: 1px solid var(--admin-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            color: var(--admin-accent);
            text-decoration: none;
        }
        .admin-brand-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg,#00d4ff22,#7c3aed22);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
        }
        .admin-topbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .admin-session-info {
            font-size: 0.75rem;
            color: var(--admin-muted);
        }
        /* ── Page wrapper ── */
        .admin-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        /* ── Cards ── */
        .admin-card {
            background: var(--admin-surface);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        /* ── Stat cards ── */
        .stat-card {
            background: var(--admin-surface);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.35rem;
        }
        .stat-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--admin-muted);
        }
        /* ── Table ── */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }
        .admin-table th {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--admin-muted);
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid var(--admin-border);
            text-align: left;
        }
        .admin-table td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.85rem;
            vertical-align: middle;
        }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover td { background: rgba(255,255,255,0.025); }
        /* ── HMAC badges ── */
        .hmac-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.2em 0.6em;
            border-radius: 20px;
        }
        .hmac-ok      { background: rgba(34,197,94,0.12);  color: #22c55e; border: 1px solid rgba(34,197,94,0.25); }
        .hmac-bad     { background: rgba(239,68,68,0.12);  color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
        .hmac-legacy  { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
        /* ── Form fields ── */
        .admin-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--admin-border);
            border-radius: 8px;
            color: #e2e8f0;
            padding: 0.65rem 0.9rem;
            width: 100%;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .admin-input:focus {
            outline: none;
            border-color: rgba(0,212,255,0.5);
            background: rgba(255,255,255,0.07);
        }
        .admin-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--admin-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.4rem;
            display: block;
        }
        /* ── Buttons ── */
        .btn-admin-primary {
            background: linear-gradient(135deg,#00d4ff,#0096b4);
            color: #0a0f1a;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-admin-primary:hover { opacity: 0.88; }
        .btn-admin-danger {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            font-weight: 700;
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 0.45rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-admin-danger:hover { background: rgba(239,68,68,0.18); }
        .btn-admin-sm {
            background: rgba(0,212,255,0.08);
            color: var(--admin-accent);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 6px;
            padding: 0.3rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-admin-sm:hover {
            background: rgba(0,212,255,0.16);
            color: var(--admin-accent);
        }
        /* ── Alert ── */
        .admin-alert {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
        }
        .admin-alert-danger  { background: rgba(239,68,68,0.1);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
        .admin-alert-success { background: rgba(34,197,94,0.1);  color: #86efac; border: 1px solid rgba(34,197,94,0.25); }
        .admin-alert-warning { background: rgba(245,158,11,0.1); color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }
        .admin-alert-info    { background: rgba(0,212,255,0.08); color: #67e8f9; border: 1px solid rgba(0,212,255,0.2); }
        /* ── Crypto box ── */
        .crypto-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            font-family: 'Cascadia Code','Fira Code','Courier New',monospace;
            font-size: 0.75rem;
            color: #94a3b8;
            word-break: break-all;
        }
        .crypto-box .key   { color: #67e8f9; }
        .crypto-box .value { color: #e2e8f0; }
        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--admin-muted);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; }
        /* ── Responsive ── */
        @media (max-width: 640px) {
            .admin-page { padding: 1rem; }
            .admin-topbar { padding: 0.65rem 1rem; }
            .hide-mobile { display: none !important; }
        }
    </style>
</head>
<body>
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
