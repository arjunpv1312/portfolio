<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} – {{ title }} | Arjun PV</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <link rel="preconnect" href="https://cdn.replit.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.min.css') }}">
    <style>
        .err-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, rgba(0,212,255,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(124,58,237,0.07) 0%, transparent 60%),
                        #080b14;
            padding: 2rem 1rem;
        }
        .err-box {
            max-width: 540px;
            width: 100%;
            text-align: center;
            animation: errFadeUp 0.55s cubic-bezier(.22,.61,.36,1) both;
        }
        @keyframes errFadeUp {
            from { opacity:0; transform:translateY(28px); }
            to   { opacity:1; transform:translateY(0);    }
        }
        .err-code {
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -4px;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 32px rgba(0,212,255,0.25));
        }
        .err-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 0.75rem;
        }
        .err-message {
            color: rgba(240,246,252,0.65);
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
        }
        .err-hint {
            color: rgba(0,212,255,0.7);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .err-icon-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0,212,255,0.07);
            border: 1.5px solid rgba(0,212,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: #00d4ff;
        }
        .err-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            border-radius: 2rem;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: filter 0.25s, transform 0.25s;
            border: none;
        }
        .err-btn:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            color: #fff;
        }
        .err-divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg,#00d4ff,#7c3aed);
            border-radius: 4px;
            margin: 1.25rem auto;
        }
        html[data-theme="light"] .err-page {
            background: radial-gradient(ellipse at 30% 40%, rgba(0,100,200,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(124,58,237,0.06) 0%, transparent 60%),
                        #f0f4ff;
        }
        html[data-theme="light"] .err-title { color: #1e293b; }
        html[data-theme="light"] .err-message { color: #475569; }
    </style>
</head>
<body>
<div class="err-page">
    <div class="err-box">
        <div class="err-icon-ring">
            {% if code == 404 %}
                <i class="fas fa-compass"></i>
            {% elif code == 500 %}
                <i class="fas fa-server"></i>
            {% elif code == 429 %}
                <i class="fas fa-gauge-high"></i>
            {% elif code == 413 %}
                <i class="fas fa-file-circle-xmark"></i>
            {% else %}
                <i class="fas fa-triangle-exclamation"></i>
            {% endif %}
        </div>
        <div class="err-code">{{ code }}</div>
        <div class="err-divider"></div>
        <h1 class="err-title">{{ title }}</h1>
        <p class="err-message">{{ message }}</p>
        <p class="err-hint"><i class="fas fa-lightbulb me-1"></i>{{ hint }}</p>
        <a href="/" class="err-btn">
            <i class="fas fa-house"></i> Back to Portfolio
        </a>
    </div>
</div>
<script>
    (function(){
        var t=localStorage.getItem('theme')||'dark';
        document.documentElement.setAttribute('data-theme',t);
        document.documentElement.setAttribute('data-bs-theme',t);
    })();
</script>
</body>
</html>
